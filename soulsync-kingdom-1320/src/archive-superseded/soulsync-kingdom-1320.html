<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SoulSync Kingdom · 1320 SoulCode 原型 v0.2</title>
<style>
:root{
  --ink:#070d24; --deep:#0f1b45; --dusk:#1b2a63; --gold:#f0c97a; --gold-d:#c99a45;
  --moon:#e8ecfb; --mist:#9fabd6; --line:rgba(159,171,214,.3); --glow:rgba(240,201,122,.22);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--moon);font-family:var(--sans);font-size:16px;line-height:1.75}
body{min-height:100dvh;background:radial-gradient(120% 70% at 50% 0%,var(--dusk) 0%,var(--deep) 38%,var(--ink) 80%) fixed}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#shell{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) max(18px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(18px,env(safe-area-inset-left))}
@media (min-width:768px){#shell{max-width:560px}h1{font-size:40px}}
#bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 4px}
#bar .brand{font-family:var(--serif);letter-spacing:.08em;color:var(--gold);font-size:15px}
.hdr-r{display:flex;gap:8px}
#app{flex:1;outline:none;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.05em;margin:0 0 .5em;line-height:1.35}
h1{font-size:34px} h2{font-size:25px} h3{font-size:18px;color:var(--gold)}
p{margin:0 0 1em}
.small{font-size:14px;color:var(--mist);line-height:1.65}
.lead{font-family:var(--serif);font-size:19px;line-height:1.9}
.scr{padding-top:14px;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn{display:inline-block;background:var(--gold);color:#241a05;border:0;padding:13px 26px;border-radius:999px;font-weight:600;letter-spacing:.05em;min-height:48px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--moon);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--mist);text-decoration:underline;text-underline-offset:4px;padding:10px 8px;min-height:44px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.stack>*+*{margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:rgba(15,27,69,.6);border:1px solid var(--line);border-left:3px solid var(--gold-d);border-radius:4px 14px 14px 4px;padding:12px 16px;min-height:52px}
.opt:hover{background:rgba(27,42,99,.8)}
.opt.sel{border-color:var(--gold);background:rgba(240,201,122,.14)}
.opt.sel::after{content:"  ✓";color:var(--gold)}
.opt.quiet{border-left-color:var(--line);color:var(--mist)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;border:1px solid var(--gold-d);color:var(--gold);border-radius:999px;padding:1px 10px;font-size:12px;line-height:1.7}
.tag.sample{border-style:dashed}
.note{border-left:2px solid var(--gold-d);padding:2px 0 2px 14px;color:var(--mist);font-size:14px;margin:16px 0}
.card{border:1px solid var(--line);background:rgba(7,13,36,.55);border-radius:6px;padding:16px;margin-top:12px}
.card.fixed{border-color:var(--gold-d)}
input[type=text],textarea,select{width:100%;background:rgba(7,13,36,.7);color:var(--moon);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;min-height:48px}
textarea{min-height:92px;resize:vertical}
label.f{display:block;margin:14px 0 6px;font-size:14px;color:var(--mist)}
.chk{display:flex;gap:12px;align-items:center;padding:6px 0;min-height:48px;border-bottom:1px solid var(--line)}
.chk input{width:24px;height:24px;accent-color:var(--gold);flex:none;margin:0}
.chk span{flex:1}
.err{color:#ffb4a8;font-size:14px;min-height:1.6em;margin-top:8px}
.tinybtn{background:none;border:1px solid var(--line);border-radius:999px;color:var(--mist);padding:6px 14px;font-size:14px;min-height:44px;min-width:44px}
.tinybtn[disabled]{opacity:.4}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* walker + lamp */
.walker{display:block;width:100%;height:100%;overflow:visible}
.walker .lp{fill:rgba(7,13,36,.9);stroke:var(--gold-d);stroke-width:1.4;transition:fill .8s,filter .8s}
.walker .lp.on{fill:var(--gold);filter:drop-shadow(0 0 5px rgba(240,201,122,.95))}
.wk{position:absolute;width:58px;height:87px;transition:left 1.5s ease-in-out,top 1.5s ease-in-out;pointer-events:none;z-index:2}
.wk-sm{float:right;width:52px;height:78px;margin:0 0 6px 10px}
.wk-hero{width:84px;height:126px;margin:0 auto 8px}
.lampcap{font-size:14px;color:var(--mist);text-align:center;margin:0 0 12px}
.wisp{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff3cf;box-shadow:0 0 14px 6px rgba(240,201,122,.6);animation:wisp 3s ease-in-out infinite alternate;pointer-events:none;z-index:3}
@keyframes wisp{to{transform:translate(6px,-8px);opacity:.6}}
.dust{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ffe9b0;box-shadow:0 0 8px 2px rgba(240,201,122,.8);animation:dustfade 1.8s ease-out forwards;pointer-events:none;z-index:1}
@keyframes dustfade{to{opacity:0;transform:translateY(-14px) scale(.3)}}
.far{position:absolute;width:14px;height:24px;transform:translate(-50%,-50%);opacity:.35;pointer-events:none;animation:faint 6s ease-in-out infinite alternate}
.far svg{width:100%;height:100%;fill:rgba(255,236,190,.85);filter:blur(.4px) drop-shadow(0 0 4px rgba(240,201,122,.8))}
@keyframes faint{to{opacity:.12}}

/* dream */
.stage{position:relative;height:330px;margin:6px 0}
.stage .wk-hero{position:absolute;left:50%;bottom:0;transform:translateX(-50%);margin:0}
.fl{position:absolute;width:68px;height:68px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle,rgba(240,201,122,.35),rgba(240,201,122,.05) 70%);color:var(--gold);font-family:var(--serif);font-size:28px;display:grid;place-items:center;animation:drift 7s ease-in-out infinite alternate;transition:opacity .6s,transform .6s}
.fl.gone{opacity:0;transform:scale(.3);pointer-events:none}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(14px,-18px)}}
.slots{display:flex;justify-content:center;gap:12px;margin:10px 0}
.slot{width:54px;height:66px;border-bottom:2px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:38px;color:transparent;transition:all .6s}
.slot.on{color:var(--gold);border-color:var(--gold);text-shadow:0 0 18px var(--gold)}
.slots.all .slot{text-shadow:0 0 28px var(--gold)}

/* door */
.door{position:relative;width:170px;height:230px;margin:6px auto 18px;border-radius:85px 85px 0 0;overflow:hidden;background:radial-gradient(circle at 50% 60%,var(--gold),#6b4a14 55%,transparent 80%);box-shadow:0 0 50px var(--glow)}
.door i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#16255a,#0a1334);transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
.door i:first-child{left:0;border-right:1px solid var(--gold-d)} .door i:last-child{right:0;border-left:1px solid var(--gold-d)}
.door.open i:first-child{transform:translateX(-96%)} .door.open i:last-child{transform:translateX(96%)}
.socks{display:flex;justify-content:center;gap:14px;margin:8px 0}
.socks b{width:54px;height:54px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:var(--gold);font-weight:400;background:rgba(7,13,36,.6);transition:all .4s}
.socks b.on{border:1.5px solid var(--gold);box-shadow:0 0 18px rgba(240,201,122,.6);background:rgba(240,201,122,.15)}
.socks.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto 0}
.pad button{height:54px;border-radius:12px;background:rgba(15,27,69,.7);border:1px solid var(--line);font-size:21px;font-family:var(--serif)}
.pad button.sm{font-size:14px;font-family:var(--sans);color:var(--mist)}

/* map */
.map{position:relative;height:400px;margin:10px -4px 4px}
.map svg.line{position:absolute;inset:0;width:100%;height:100%}
.map polyline{fill:none;stroke:var(--gold-d);stroke-width:1.2;stroke-dasharray:3 6;vector-effect:non-scaling-stroke;opacity:.8}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:96px;min-height:92px;text-align:center}
.node b{display:grid;place-items:center;margin:0 auto;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--gold);font-family:var(--serif);font-size:26px;font-weight:400;color:var(--gold);background:rgba(7,13,36,.7);box-shadow:0 0 22px var(--glow)}
.node span{display:block;font-size:13px;margin-top:6px;color:var(--moon);text-shadow:0 1px 6px #000}
.node.done b{background:var(--gold);color:#241a05;box-shadow:0 0 34px rgba(240,201,122,.6)}
.legend{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:56px}
.legend em{font-style:normal;color:var(--mist);font-size:13px}
.legend strong{color:var(--gold);font-family:var(--serif);margin-right:8px}
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rh .code{font-family:var(--serif);color:var(--gold);font-size:14px;letter-spacing:.08em}

/* scenes */
.sym{aspect-ratio:1/0.8;min-height:72px;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:22px;background:rgba(15,27,69,.6);border:1px solid var(--line);border-radius:50% 50% 12px 12px/38% 38% 12px 12px}
.sym:hover{border-color:var(--gold)}
.bigsym{font-family:var(--serif);font-size:44px;color:var(--gold);text-align:center;margin:8px 0;text-shadow:0 0 28px var(--glow)}
canvas.wave{width:100%;height:190px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--gold);height:44px}
.breath{width:150px;height:150px;border-radius:50%;margin:24px auto;background:radial-gradient(circle,rgba(240,201,122,.5),rgba(240,201,122,.06) 70%);border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);color:var(--gold)}
.breath.run{animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.mirror{border-left:2px solid var(--gold-d);padding-left:14px;margin:14px 0}
.bp-card{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bp-card .d{font-family:var(--serif);font-size:30px;color:var(--gold);line-height:1.1;text-align:center}
.bp-card .d small{display:block;font-size:11px;color:var(--mist);font-family:var(--sans)}
details summary{cursor:pointer;color:var(--mist);padding:10px 0;min-height:44px}
.mine-t{border-left:2px solid var(--gold);padding-left:12px;margin:8px 0}

/* meteor keyshot */
.mstage{position:relative;height:350px;margin:6px auto 0;max-width:340px}
.mwalk{position:absolute;left:50%;bottom:0;width:110px;height:165px;transform:translateX(-50%)}
.mbot{position:absolute;left:calc(50% - 13px);top:244px;width:26px;height:40px;transition:transform 1.9s cubic-bezier(.3,0,.2,1),opacity 1.9s}
.mbot svg{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(240,201,122,.7))}
.mstage.rise .mbot{transform:translate(70px,-215px) scale(.35);opacity:0}
.mbeam{position:absolute;left:calc(50% + 31px);top:306px;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff3cf;box-shadow:0 0 14px 6px rgba(240,201,122,.8);opacity:0}
.mstage.beam .mbeam{animation:beamgo 1.3s ease-in-out forwards}
@keyframes beamgo{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(-31px,-42px)}}
.mstar{position:absolute;right:14%;top:24px;width:12px;height:12px;border-radius:50%;background:#ffe9b0;box-shadow:0 0 22px 8px rgba(240,201,122,.7);opacity:0;transition:opacity 1.2s}
.mstage.land .mstar{opacity:1}

/* wall */
.wall{position:relative;height:420px;margin:8px -6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(70% 60% at 50% 40%,rgba(27,42,99,.55),transparent)}
.st{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--moon)}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:#dfe6ff;box-shadow:0 0 12px 3px rgba(223,230,255,.6);transition:all .3s}
.st.mine::before{background:var(--gold);box-shadow:0 0 0 3px rgba(240,201,122,.35),0 0 12px 3px rgba(240,201,122,.6)}
.st.echoed::before{background:#ffe9b0;box-shadow:0 0 16px 5px rgba(255,233,176,.75)}
.st.cur::before{outline:1px solid #fff;outline-offset:5px}
.st.ring::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;border:1px solid var(--gold);animation:ring 1.7s ease-out forwards;pointer-events:none}
@keyframes ring{to{transform:scale(5);opacity:0}}
.lampfx{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff3cf,#f0c97a 55%,rgba(240,201,122,0) 72%);box-shadow:0 0 22px 8px rgba(240,201,122,.6);transition:left 1.1s ease-in-out,top 1.1s ease-in-out;pointer-events:none;z-index:3}
.sheet{border:1px solid var(--line);border-top:2px solid var(--gold-d);background:rgba(7,13,36,.7);padding:16px;border-radius:0 0 12px 12px;min-height:130px}
.sheet blockquote{margin:8px 0;font-family:var(--serif);font-size:17px;line-height:1.9}
.sheet .lab{font-size:12px;color:var(--mist);display:block;margin-top:8px}
.gest{display:grid;grid-template-columns:1fr;gap:8px}
.opt.g{padding:10px 14px;min-height:60px;font-size:15px;line-height:1.5}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(3,6,18,.78);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#mbox{width:100%;max-width:480px;max-height:86dvh;overflow:auto;background:var(--deep);border-top:2px solid var(--gold-d);border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
#mbox ul{padding-left:20px;margin:0 0 1em} #mbox li{margin-bottom:6px}
@media print{#sky,#bar,.btn,button{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="shell">
  <header id="bar"><span class="brand" id="brand"></span><span class="hdr-r"><button class="tinybtn" id="sfxBtn" aria-pressed="false"></button><button class="tinybtn" id="aboutBtn"></button></span></header>
  <main id="app" tabindex="-1"></main>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div id="mbox"></div></div>

<script>
(()=>{
'use strict';
/* =====================================================================
   SoulSync Kingdom × 1320 SoulCode — Phase A 单机原型 v0.2
   - 单文件；无外部资源；不用 localStorage / sessionStorage / cookie / fetch / 第三方分析。
   - 所有状态只在内存，刷新清空。玩家文字一律转义后输出。
   - 蓝图只由 Adapter1320.compute(birth) 生成一次（目前是示例数据）；
     场景选择只进入 ExplorationRecord，永远不会重算 S1/S3/S2/S0。
   - 公开内容只通过 buildPublicStarPayload() 白名单字段；从不序列化整个游戏状态。
   - 星墙通过 StarWallAdapter 占位接口；Phase A 不连接服务器。
   ===================================================================== */
const LANG='zh';

/* ---------- 示例数据（集中配置，全部为示例，非 1320 原始内容） ---------- */
const SAMPLE_DATA={
  birthSample:{y:1990,m:6,d:15},
  cardNames:{
    s1:[['灯火','把注意放在脚下这一小圈。'],['旅人','愿意在途中停下来看看。'],['匠人','喜欢把一件事慢慢做好。'],['守望','习惯站在远处照看。']],
    s3:[['潮汐','来来回回，是节奏本身。'],['回声','说出去的话会以另一种声音回来。'],['微风','轻，但没有停过。'],['晨光','不急，一点点亮起来。']],
    s2:[['水岸','与他人隔着一段刚好的距离。'],['并肩','一起走，也各自看路。'],['回望','偶尔转头，看看来时的路。'],['邀请','先把门留着。']],
    s0:[['留白','不填满，也是一种完整。'],['静室','一个只属于自己的安静角落。'],['空杯','先空着，才有位置。'],['天窗','头顶有一块不被遮住的天。']]
  },
  symbols:['lamp','seed','river','mountain','door','fire'],
  wall:[
    {x:18,y:18,wish:'愿我在慢一点的日子里，也觉得自己够好。'},
    {x:62,y:12,insight:'我发现我不是不想休息，只是不知道不做事的自己是谁。',wish:'愿我学会放下一件事。'},
    {x:84,y:34,experience:'小时候家里常有争吵。长大后我才慢慢明白，那不是我的错。',insight:'今天，我第一次对自己说了这句话。',wish:'愿所有曾经害怕回家的孩子，都有一盏灯。',contentWarning:'家庭关系相关经历'},
    {x:30,y:40,wish:'想对很久没联系的朋友说一句：我想你了。'},
    {x:12,y:66,insight:'静下来的时候，我发现心跳比我以为的要吵。',wish:'愿我愿意听见。'},
    {x:70,y:70,wish:'愿今晚的星星，替我给远方的人带一句平安。'},
    {x:46,y:84,insight:'和父母的关系像一面水，我只看到了自己这边的倒影。',wish:'愿我下次开口时温柔一点。',blueprintSnippet:{module:'s2',publicName:'镜像之岸'}},
    {x:88,y:90,wish:'愿我不用成为更好的自己，也值得被好好对待。'}
  ]
};

/* ---------- 文本字典（EN 预留，缺省回退中文） ---------- */
const ZH={
'brand':'SoulSync Kingdom','bar.about':'说明','close':'关闭','ok':'知道了','back.map':'回到地图','sfx.off':'声音：关','sfx.on':'声音：开',
'intro.p1':'有一夜，你在梦里收到了一串数字。','intro.p2':'它没有解释自己，只留下一个邀请。',

'intro.btn':'进入梦境','intro.skip':'跳过序幕',
'dream.title':'接住四颗光','dream.help':'按你的节奏接住它们，先接哪一颗都可以。点击顺序不会改变它们最后的排列。',
'dream.done':'它们在你面前排成：1320。','dream.door':'远处，一道门亮了起来。','dream.next':'走向那扇门','dream.auto':'让它们直接排好',
'gate.title':'门前','gate.help':'门还关着。回答只是此刻的站位，不会改变你的蓝图，也可以选择先不回答。','gate.skip':'先不回答','gate.prog':'第 {n} 问，共 3 问',
'gate.q0':'走到门前，你此刻的身体更像哪一种？','gate.q0.a':['有一点紧','很平静','有点困','说不清'],
'gate.q1':'你是怎么走到这里的？','gate.q1.a':['出于好奇','想歇一会儿','想更理解自己','只是路过'],

};

let lastFocus=null;
function openModal(html){
  lastFocus=document.activeElement;
  $('#mbox').innerHTML=html+`<div class="row"><button class="btn ghost" data-close="1">${t('close')}</button></div>`;
  $('#modal').classList.add('on');$('#shell').inert=true;$('#mbox [data-close]').focus();
}
function closeModal(){
  $('#modal').classList.remove('on');$('#shell').inert=false;
  if(lastFocus&&document.contains(lastFocus)&&lastFocus.focus)lastFocus.focus();else app.focus();
  lastFocus=null;
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal();});
document.addEventListener('keydown',e=>{
  const m=$('#modal');if(!m.classList.contains('on'))return;
  if(e.key==='Escape'){closeModal();return;}
  if(e.key==='Tab'){
    const f=[...m.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);
    if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
    else if(!m.contains(document.activeElement)){e.preventDefault();a.focus();}
  }
});

/* ---------- 声音（默认关闭；代码合成的示意） ---------- */
let ac=null;
function sfx(kind){
  if(!S.sfx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const n=ac.currentTime;
    const tone=(f,t0,d,g)=>{const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.value=f;
      gn.gain.setValueAtTime(0.0001,n+t0);gn.gain.exponentialRampToValueAtTime(g,n+t0+0.03);gn.gain.exponentialRampToValueAtTime(0.0001,n+t0+d);
      o.connect(gn);gn.connect(ac.destination);o.start(n+t0);o.stop(n+t0+d+0.05);};
    if(kind==='lamp'){tone(660,0,1.7,.05);tone(990,.16,1.9,.035);tone(1320,.34,2,.02);}
    if(kind==='gesture'){tone(520,0,1.2,.04);tone(780,.1,1.5,.025);}
    if(kind==='step'){
      const len=Math.floor(ac.sampleRate*0.07),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
      const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      f.type='lowpass';f.frequency.value=420;g.gain.value=0.12;src.buffer=buf;src.connect(f);f.connect(g);g.connect(ac.destination);src.start(n);
    }
  }catch(e){}
}
function tone(on){
  stopTone();if(!on)return;
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=180+S.sc.s3.pace*1.6;g.gain.value=0.035;o.connect(g);g.connect(c.destination);o.start();audio={c,o,g,on:true};
  }catch(e){}
}

function afterRender(){

function syncConsent(){
  const c=$('#consent'),b=$('#pvgo');if(!c||!b)return;
  b.disabled=!c.checked;const h=$('#lockhint');if(h)h.hidden=c.checked;

function dustTrail(w){
  if(reduced())return;
  const map=w.parentElement;let k=0;
  const step=()=>{
    if(S.screen!=='map'||k++>12)return;
    const a=w.getBoundingClientRect(),b=map.getBoundingClientRect(),d=document.createElement('i');
    d.className='dust';d.style.left=(a.left-b.left+a.width/2+Math.random()*16-8)+'px';d.style.top=(a.top-b.top+a.height-8+Math.random()*8-4)+'px';
    map.appendChild(d);setTimeout(()=>d.remove(),1800);S.timers.push(setTimeout(step,120));
  };
  step();
}
function echoFx(){
  const id=S.echoFx;S.echoFx=null;if(!id)return;
  const wall=$('.wall'),star=wall&&wall.querySelector('.st.cur');if(!star)return;
  if(reduced()){star.classList.add('ring');return;}
  const lamp=document.createElement('div');lamp.className='lampfx';lamp.style.left='50%';lamp.style.top='100%';wall.appendChild(lamp);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{lamp.style.left=star.style.left;lamp.style.top=star.style.top;}));
  S.timers.push(setTimeout(()=>{lamp.remove();star.classList.add('ring');sfx('gesture');},1150));
}
/* 振动之海：此刻节奏（象征性画面，不测量任何真实频率） */
function startSea(){
  const c=$('#wave');if(!c)return;const ctx=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
  const W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr;let ph=0,last=performance.now();
  const frame=now=>{
    const s=S.sc.s3,v=s.pace/100,bt=s.bright/100,dt=(now-last)/1000;last=now;ph+=dt*(0.4+v*4);
    ctx.clearRect(0,0,W,H);
    const g=ctx.createRadialGradient(W*.75,H*.28,0,W*.75,H*.28,H*(.25+bt*.6));
    g.addColorStop(0,`rgba(255,240,200,${.15+bt*.5})`);g.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let k=0;k<3;k++){
      ctx.beginPath();const amp=H*(0.1+0.1*(1-v)+k*0.02),fr=(1.5+v*6)*(1+k*0.35);
      for(let x=0;x<=W;x+=4){const y=H*0.6+Math.sin(x/W*fr*Math.PI*2+ph+k)*amp*(1-k*0.25);x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.strokeStyle=`rgba(240,201,122,${(0.3+bt*0.6)-k*0.15})`;ctx.lineWidth=(2.2-k*0.5)*dpr;ctx.stroke();
    }
    if(!reduced())raf=requestAnimationFrame(frame);
  };
  seaRedraw=()=>frame(performance.now());
  frame(performance.now());
}
function updateSea(){
  const s=S.sc.s3,sl=$('#sl'),d=$('#seadesc'),c=$('#wave'),txt=t('s3.desc',{w:paceWord(s.pace),b:brightWord(s.bright)});
  if(sl)sl.value=s.pace;if(d)d.textContent=txt;if(c)c.setAttribute('aria-label',txt);
  if(audio)audio.o.frequency.value=180+s.pace*1.6;
  if(reduced()&&seaRedraw)seaRedraw();
}

  setC('meteor.c1');
  S.timers.push(setTimeout(()=>{st.classList.add('beam');setC('meteor.c2');sfx('lamp');},1600));
  S.timers.push(setTimeout(()=>{st.classList.add('rise');setC('meteor.c3');sfx('gesture');},3300));
  S.timers.push(setTimeout(()=>{st.classList.add('land');setC('meteor.c4');},5000));
  S.timers.push(setTimeout(()=>window.__finMeteor(),6600));
}

/* ---------- 背景星空 ---------- */
(function sky(){
  const c=$('#sky'),ctx=c.getContext('2d');let W,H,stars=[];
  const size=()=>{const d=Math.min(window.devicePixelRatio||1,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d;
    stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.3+.3)*d,p:Math.random()*6.28,s:.3+Math.random()*1.2}));draw(0);};
  const draw=tm=>{ctx.clearRect(0,0,W,H);for(const s of stars){const a=.35+.45*Math.sin(tm/1000*s.s+s.p);ctx.fillStyle=`rgba(225,232,255,${Math.max(a,.1)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}};
  const loop=tm=>{draw(tm);requestAnimationFrame(loop);};
  size();addEventListener('resize',size);if(!reduced())requestAnimationFrame(loop);
})();

/* ---------- 动作 ---------- */
function finishScene(id){
  const s=S.sc[id];let choice='',words=s.note||'';
  if(id==='s1'){choice=`${s.sym}:${s.act}`;if(s.name)words=(s.name+' / '+words).trim();}
  if(id==='s3')choice=`${s.act}:${paceWord(s.pace)}`;
  if(id==='s2')choice=`${s.rel}:${s.act}`;
  if(id==='s0'){choice=s.act;if(s.word)words=(s.word+' / '+words).trim();}
  /* ExplorationRecord：只记录当下探索，永不回写或重算固定蓝图 */
  S.rec[id]={module:id,sceneVersion:SCENE_VERSION,choice,playerWords:words,completed:true};
  s.step='done';S.visited[id]=true;
}
const A={
  enter(){go('dream');},
  skipPrologue(){go('dream');},
  dreamTake(d){
    const i=+d.i;if(S.dream.includes(i))return;S.dream.push(i);
    const b=app.querySelector(`.fl[data-i="${i}"]`);if(b)b.classList.add('gone');
    const sl=app.querySelector(`.slot[data-slot="${i}"]`);if(sl)sl.classList.add('on');
    if(S.dream.length===4)S.timers.push(setTimeout(()=>render(),reduced()?100:900));
  },
  dreamAuto(){S.dream=[0,1,2,3];render();},
  dreamNext(){go('gate');},
  gateAns(d){S.gate[S.gq]=+d.v;if(S.gq<2){S.gq++;render();window.scrollTo(0,0);}else go('pw');},
  pwKey(d){pwPush(d.v);},pwClear(){S.pw='';updatePw();},pwDel(){S.pw=S.pw.slice(0,-1);updatePw();},
  birthGo(){
    const y=+S.bd.y,m=+S.bd.m,dd=+S.bd.d,e=$('#berr');
    if(!y||!m||!dd||new Date(y,m-1,dd)>new Date()){e.textContent=t('birth.err');return;}
    setBirth({y,m,d:dd},false);
  },
  birthSample(){setBirth(Object.assign({},SAMPLE_DATA.birthSample),true);},
  scene(d){S.cur=d.id;S.guided=null;go('scene');},
  guide(){
    const list=ORDER.filter(i=>!S.visited[i]);if(!list.length)return;
    const id=list[Math.floor(Math.random()*list.length)];S.guide=id;S.cur=id;S.guided=id;go('scene');
  },
  textmap(){S.showTM=!S.showTM;render();},
  toMap(){go('map');},
  redo(){const id=S.cur;S.visited[id]=false;delete S.rec[id];S.sc[id]=id==='s3'?{pace:40,bright:50}:{};render();},
  /* S1 */
  pickSym(d){S.sc.s1.sym=d.v;S.sc.s1.step='act';render();window.scrollTo(0,0);},
  s1Back(){S.sc.s1.step='pick';render();},
  s1act(d){const s=S.sc.s1;s.act=d.v;if(d.v==='rename'){s.step='rename';}else{s.step='mirror';}render();window.scrollTo(0,0);},
  s1Rename(){const s=S.sc.s1;s.name=($('#rn').value||'').trim();s.step='mirror';render();window.scrollTo(0,0);},
  /* S3 */
  s3slow(){const s=S.sc.s3;s.pace=Math.max(0,s.pace-15);updateSea();},
  s3bright(){const s=S.sc.s3;s.bright=Math.min(100,s.bright+15);updateSea();},
  snd(){const on=!audio;tone(on);const b=$('#sndBtn');if(b)b.textContent=on?t('s3.snd.off'):t('s3.snd.on');},
  s3nosound(){stopTone();S.sc.s3.noSound=true;render();},
  s3act(d){stopWave();S.sc.s3.act=d.v;S.sc.s3.step='mirror';render();window.scrollTo(0,0);},
  /* S2 */
  pickRel(d){S.sc.s2.rel=d.v;S.sc.s2.step='act';render();window.scrollTo(0,0);},
  s2act(d){S.sc.s2.act=d.v;S.sc.s2.step='mirror';render();window.scrollTo(0,0);},
  /* S0 */
  breatheStart(){
    const br=$('#br'),lab=$('#brl'),btn=$('#brGo');if(!br||btn.disabled)return;
    btn.disabled=true;if(!reduced())br.classList.add('run');let n=0;
    const tick=()=>{
      if(n>=6){S.sc.s0.skipped=false;S.sc.s0.step='act';render();return;}
      lab.textContent=n%2===0?t('s0.in'):t('s0.out');n++;S.timers.push(setTimeout(tick,4000));
    };
    tick();
  },
  breatheSkip(){clearTimers();S.sc.s0.skipped=true;S.sc.s0.step='act';render();},
  s0act(d){
    const s=S.sc.s0;
    if(d.v==='back'){go('map');return;}
    s.act=d.v;s.step=d.v==='word'?'word':'mirror';render();window.scrollTo(0,0);
  },
  s0Word(){const s=S.sc.s0;s.word=($('#word').value||'').trim();s.step='mirror';render();window.scrollTo(0,0);},
  finish(){
    const id=S.cur;finishScene(id);S.lastDone=id;S.lastLit=id;sfx('lamp');
    if(visitedN()===4&&!S.merged){S.merged=true;go('merge');}else go('map');
  },
  showBp(){go('bp');},
  report(){openModal(`<h2 id="mtitle">${t('fr.title')}</h2><p>${t('fr.have')}</p><p class="note">${t('fr.status')}</p><p>${t('fr.restore')}</p>`);},
  mine(){go('mine');},
  /* 星愿 */
  toBottle(){go('bottle');},
  toPreview(){
    const p=buildPublicStarPayload();S.bottle.err='';
    if(!payloadHasText(p)){S.bottle.err=t('btl.empty');$('#berr').textContent=S.bottle.err;return;}
    if(payloadHasContact(p)){S.bottle.err=t('btl.contact');$('#berr').textContent=S.bottle.err;return;}
    S.consent=false;go('preview');
  },
  regen(){S.alias=newAlias();S.consent=false;render();},
  pvBack(){go('bottle');},
  sealPrivate(){
    const p=buildPublicStarPayload();
    if(!payloadHasText(p)){S.bottle.err=t('btl.empty');if(S.screen==='bottle')$('#berr').textContent=S.bottle.err;else go('bottle');return;}
    S.privateStars.push({experience:p.experience,insight:p.insight,wish:p.wish,blueprintSnippet:p.blueprintSnippet});
    S.bottle={exp:'',ins:'',wish:'',snip:'',cw:false,cwTag:'family',err:''};S.consent=false;go('privateDone');
  },
  publish(){
    if(!S.consent)return;
    const p=buildPublicStarPayload();
    if(!payloadHasText(p)||payloadHasContact(p)){go('bottle');return;}
    const r=StarWallAdapter.submit(p);
    S.wall=[r.item];S.wallSel=0;S.bottle={exp:'',ins:'',wish:'',snip:'',cw:false,cwTag:'family',err:''};S.consent=false;
    go('meteor');
  },
  skipMeteor(){clearTimers();if(window.__finMeteor)window.__finMeteor();},
  toWall0(){S.wallSel=S.wall.length?0:-1;go('wall');},
  wallSel(d){S.wallSel=+d.i;render();},
  cwShow(){const s=allStars()[S.wallSel];S.wallCw[s.id]=true;render();},
  gesture(d){
    const s=allStars()[S.wallSel];if(!s||s.mine)return;
    if(S.gest[s.id]===d.v){delete S.gest[s.id];S.echoFx=null;}else{S.gest[s.id]=d.v;S.echoFx=s.id;}
    render();
  },
  restart(){openModal(`<h2 id="mtitle">${t('again')}</h2><p>${t('again.confirm')}</p><div class="row"><button class="btn" data-act="restartYes">${t('again.yes')}</button></div>`);},
  restartYes(){closeModal();const f=S.sfx;stopWave();clearTimers();S=fresh();S.sfx=f;go('intro');}
};
function setBirth(b,sample){S.birth=b;S.sampleDate=sample;S.bp=Adapter1320.compute(b);go('map');}
function pwPush(n){
  if(S.pwOk||S.pw.length>=4)return;
  S.pw+=n;updatePw();if(S.pw.length===4)S.timers.push(setTimeout(checkPw,250));
}
function updatePw(){const bx=$('#pwbox');if(!bx)return;bx.querySelectorAll('b').forEach((b,i)=>{b.textContent=S.pw[i]||'';b.classList.toggle('on',!!S.pw[i]);});}
function checkPw(){
  if(S.pw==='1320'){
    S.pwOk=true;$('#door').classList.add('open');$('#pwerr').textContent='';
    S.timers.push(setTimeout(()=>go('birth'),reduced()?200:1500));
  }else{
    S.pwErr++;const bx=$('#pwbox');bx.classList.add('shake');
    $('#pwerr').textContent=S.pwErr>=2?t('pw.err')+' '+t('pw.hint'):t('pw.err');
    S.timers.push(setTimeout(()=>{S.pw='';bx.classList.remove('shake');updatePw();},450));
  }
}

/* ---------- 事件代理 ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset);});
$('#mbox').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f)f(b.dataset);});
app.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.bind;if(!k)return;
  if(k==='slider'){S.sc.s3.pace=+el.value;updateSea();}
  if(k==='note')S.sc[S.cur].note=el.value;
  if(k==='word')S.sc.s0.word=el.value;
  if(k==='rname')S.sc.s1.name=el.value;
  if(k==='exp')S.bottle.exp=el.value;
  if(k==='ins')S.bottle.ins=el.value;
  if(k==='wish')S.bottle.wish=el.value;
});
app.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.bind;if(!k)return;
  if(k==='cw'){S.bottle.cw=el.checked;const r=$('#cwrow');if(r)r.hidden=!el.checked;}
  if(k==='cwTag')S.bottle.cwTag=el.value;
  if(k==='snip')S.bottle.snip=el.value;
  if(k==='consent'){S.consent=el.checked;syncConsent();}
  if(k==='by'||k==='bm'||k==='bd'){
    S.bd[{by:'y',bm:'m',bd:'d'}[k]]=el.value;
    if(k!=='bd'){const d=$('#bd');if(+S.bd.d>dim(+S.bd.y||2000,+S.bd.m||1))S.bd.d='';d.innerHTML=dayOpts();}
  }
});
document.addEventListener('keydown',e=>{
  if(S.screen!=='pw'||$('#modal').classList.contains('on'))return;
  const tg=document.activeElement&&document.activeElement.tagName;
  if(/^[0-9]$/.test(e.key)&&tg!=='INPUT'&&tg!=='SELECT'&&tg!=='TEXTAREA')pwPush(e.key);
  if(e.key==='Backspace'){S.pw=S.pw.slice(0,-1);updatePw();}
});

/* ---------- 启动 ---------- */
$('#brand').textContent=t('brand');
$('#aboutBtn').textContent=t('bar.about');
$('#aboutBtn').addEventListener('click',()=>openModal(aboutHtml()));
const sfxBtn=$('#sfxBtn');sfxBtn.textContent=t('sfx.off');
sfxBtn.addEventListener('click',()=>{S.sfx=!S.sfx;sfxBtn.textContent=t(S.sfx?'sfx.on':'sfx.off');sfxBtn.setAttribute('aria-pressed',S.sfx);sfx('gesture');});
render();
})();
</script>
