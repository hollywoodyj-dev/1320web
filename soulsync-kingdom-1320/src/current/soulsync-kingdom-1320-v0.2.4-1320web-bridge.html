<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SoulSync Kingdom · 1320 SoulCode 原型 v0.2.4 · 1320web Bridge</title>
<style>
:root{
  --ink:#070d24; --deep:#0f1b45; --dusk:#1b2a63; --gold:#f0c97a; --gold-d:#c99a45;
  --danger:#ffb4a8; --moon:#e8ecfb; --mist:#a9b4dc; --line:rgba(159,171,214,.3); --glow:rgba(240,201,122,.22);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--moon);font-family:var(--sans);font-size:16px;line-height:1.75}
body{min-height:100dvh;background:radial-gradient(120% 70% at 50% 0%,var(--dusk) 0%,var(--deep) 38%,var(--ink) 80%) fixed}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#shell{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) calc(18px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(18px + env(safe-area-inset-left))}
#bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 4px;gap:8px}
#bar .brand{font-family:var(--serif);letter-spacing:.08em;color:var(--gold);font-size:16px}
.hdr-r{display:flex;gap:8px}
#app{flex:1;outline:none;padding-bottom:44px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.05em;margin:0 0 .5em;line-height:1.35}
h1{font-size:34px} h2{font-size:25px} h3{font-size:18px;color:var(--gold)}
p{margin:0 0 1em}
.small{font-size:16px;color:var(--mist);line-height:1.7}
.cap{font-size:14px;color:var(--mist);line-height:1.6}
.lead{font-family:var(--serif);font-size:19px;line-height:1.9}
.scr{padding-top:16px;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn{display:inline-block;background:var(--gold);color:#241a05;border:0;padding:12px 26px;border-radius:999px;font-weight:600;letter-spacing:.05em;min-height:48px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--moon);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--mist);text-decoration:underline;text-underline-offset:4px;padding:10px 6px;min-height:44px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.stack>*+*{margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:rgba(15,27,69,.6);border:1px solid var(--line);border-left:3px solid var(--gold-d);border-radius:4px 14px 14px 4px;padding:12px 16px;min-height:52px}
.opt:hover{background:rgba(27,42,99,.8)}
.opt.sel{border-color:var(--gold);background:rgba(240,201,122,.12)}
.opt.quiet{border-left-color:rgba(201,154,69,.55);color:#c9d2f2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;border:1px solid var(--gold-d);color:var(--gold);border-radius:999px;padding:2px 12px;font-size:14px;line-height:1.6}
.tag.sample{border-style:dashed}
.note{border-left:2px solid var(--gold-d);padding:2px 0 2px 14px;color:var(--mist);font-size:16px;margin:16px 0}
.card{border:1px solid var(--line);background:rgba(7,13,36,.55);border-radius:6px;padding:16px;margin-top:12px}
.card.fixed{border-color:var(--gold-d)}
input[type=text],textarea,select{width:100%;background:rgba(7,13,36,.7);color:var(--moon);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;min-height:48px}
textarea{min-height:92px;resize:vertical}
.extra{margin:22px 0 4px;padding-top:14px;border-top:1px dashed var(--line)}
label.f{display:block;margin:14px 0 6px;font-size:16px;color:var(--mist)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px}
.chk input{width:24px;height:24px;margin-top:3px;accent-color:var(--gold);flex:none}
.err{color:var(--danger);font-size:16px;min-height:1.6em;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tinybtn{background:none;border:1px solid var(--line);border-radius:999px;color:var(--mist);padding:6px 14px;font-size:14px;min-height:44px;min-width:44px}

/* walker */
.walker{display:block;width:100%;height:100%;overflow:visible}
.walker .lp{fill:rgba(7,13,36,.9);stroke:var(--gold-d);stroke-width:1.4;transition:fill .8s,filter .8s}
.walker .lp.on{fill:var(--gold);filter:drop-shadow(0 0 5px rgba(240,201,122,.95))}
.wk{position:absolute;width:58px;height:87px;transition:left 1.5s ease-in-out,top 1.5s ease-in-out;pointer-events:none;z-index:2}
.wk-sm{float:right;width:52px;height:78px;margin:0 0 6px 10px}
.wk-hero{width:84px;height:126px;margin:0 auto 8px}
.wk-hero.big{width:112px;height:168px}
.lampcap{font-size:16px;color:var(--mist);text-align:center;margin:0 0 6px}

/* prologue + dream */
.pl{animation:fadein 1.4s both}
.fd{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe9b0;box-shadow:0 0 12px 4px rgba(240,201,122,.7);animation:fadein 2s both,faint 4s 2s ease-in-out infinite alternate}
.pro{position:relative}
.stage{position:relative;height:290px;margin:6px 0}
.fl{position:absolute;width:68px;height:68px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle,rgba(240,201,122,.35),rgba(240,201,122,.05) 70%);color:var(--gold);font-family:var(--serif);font-size:28px;display:grid;place-items:center;animation:drift 7s ease-in-out infinite alternate;transition:opacity .6s,transform .6s}
.fl.gone{opacity:0;transform:scale(.3);pointer-events:none}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(14px,-18px)}}
.slots{display:flex;justify-content:center;gap:12px;margin:10px 0}
.slot{width:54px;height:66px;border-bottom:2px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:38px;color:transparent;transition:all .6s}
.slot.on{color:var(--gold);border-color:var(--gold);text-shadow:0 0 18px var(--gold)}

/* door */
.door{position:relative;width:190px;height:230px;margin:6px auto 18px;border-radius:95px 95px 0 0;overflow:hidden;background:radial-gradient(circle at 50% 60%,var(--gold),#6b4a14 55%,transparent 80%);box-shadow:0 0 50px var(--glow)}
.door i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#16255a,#0a1334);transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
.door i:first-child{left:0;border-right:1px solid var(--gold-d)} .door i:last-child{right:0;border-left:1px solid var(--gold-d)}
.door.open i:first-child{transform:translateX(-96%)} .door.open i:last-child{transform:translateX(96%)}
.sock{position:absolute;left:0;right:0;top:56%;display:flex;justify-content:center;gap:6px;z-index:2;transition:opacity .6s}
.door.open .sock{opacity:0}
.sock u{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold-d);background:rgba(7,13,36,.85);display:grid;place-items:center;text-decoration:none;font-family:var(--serif);font-size:20px;color:var(--gold)}
.sock u.on{background:rgba(240,201,122,.25);border-color:var(--gold);box-shadow:0 0 14px var(--glow)}
.sock.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto 0}
.pad button{height:54px;border-radius:12px;background:rgba(15,27,69,.7);border:1px solid var(--line);font-size:21px;font-family:var(--serif)}
.pad button.sm{font-size:16px;font-family:var(--sans);color:var(--mist)}

/* map */
.map{position:relative;height:400px;margin:10px -4px 4px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map polyline{fill:none;stroke:var(--gold-d);stroke-width:1.2;stroke-dasharray:3 6;vector-effect:non-scaling-stroke;opacity:.8}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:92px;text-align:center}
.node b{display:grid;place-items:center;margin:0 auto;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--gold);font-family:var(--serif);font-size:26px;font-weight:400;color:var(--gold);background:rgba(7,13,36,.7);box-shadow:0 0 22px var(--glow)}
.node span{display:block;font-size:14px;margin-top:4px;color:var(--moon);text-shadow:0 1px 6px #000;line-height:1.4}
.node em{display:block;font-style:normal;font-size:14px;color:var(--gold);line-height:1.3}
.node.done b{background:var(--gold);color:#241a05;box-shadow:0 0 34px rgba(240,201,122,.6)}
.node.pulse b{animation:pulse 1s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 50px 12px rgba(240,201,122,.8)}}
.legend{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:56px}
.legend em{font-style:normal;color:var(--mist);font-size:14px;flex:none;margin-left:10px}
.legend strong{color:var(--gold);font-family:var(--serif);margin-right:8px}
.lampfx{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff3cf,#f0c97a 55%,rgba(240,201,122,0) 72%);box-shadow:0 0 22px 8px rgba(240,201,122,.6);transition:left 1.2s ease-in-out,top 1.2s ease-in-out,opacity .4s;pointer-events:none;z-index:3}
.dust{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ffe9b0;box-shadow:0 0 8px 2px rgba(240,201,122,.8);animation:dustfade 1.8s ease-out forwards;pointer-events:none;z-index:1}
@keyframes dustfade{to{opacity:0;transform:translateY(-14px) scale(.3)}}
.far{position:absolute;width:14px;height:24px;transform:translate(-50%,-50%);opacity:.35;pointer-events:none;animation:faint 6s ease-in-out infinite alternate}
.far svg{width:100%;height:100%;fill:rgba(255,236,190,.85);filter:blur(.4px) drop-shadow(0 0 4px rgba(240,201,122,.8))}
@keyframes faint{to{opacity:.12}}

/* scenes */
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rh .code{font-family:var(--serif);color:var(--gold);font-size:15px;letter-spacing:.1em}
.sym{padding:8px 10px;min-height:110px;overflow-wrap:anywhere;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:22px;background:rgba(15,27,69,.6);border:1px solid var(--line);border-radius:50% 50% 12px 12px/38% 38% 12px 12px}
.sym:hover{border-color:var(--gold)}
.bigsym{font-family:var(--serif);font-size:44px;color:var(--gold);text-align:center;margin:8px 0;text-shadow:0 0 28px var(--glow)}
canvas.wave{width:100%;height:170px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--gold);height:44px}
.breath{width:150px;height:150px;border-radius:50%;margin:26px auto;background:radial-gradient(circle,rgba(240,201,122,.5),rgba(240,201,122,.06) 70%);border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);color:var(--gold);font-size:20px}
.breath.run{animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.bp-card{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bp-card .d{font-family:var(--serif);font-size:30px;color:var(--gold);line-height:1.1;text-align:center}
.bp-card .d small{display:block;font-size:14px;color:var(--mist);font-family:var(--sans)}
details summary{cursor:pointer;color:var(--mist);padding:10px 0;min-height:44px}
.bottle{width:110px;margin:6px auto;display:block;filter:drop-shadow(0 0 22px var(--glow));animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.pv{margin:10px 0 0;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px 12px 12px 4px;font-family:var(--serif);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.pv.empty{color:var(--mist);border-left-color:var(--line);font-family:var(--sans)}
.nopub{margin:14px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px}
.nopub ul{margin:6px 0 0;padding-left:20px}

/* meteor stage */
.mstage{position:relative;width:320px;max-width:100%;height:380px;margin:0 auto}
.mstage canvas{position:absolute;inset:0;width:100%;height:100%}
.mw{position:absolute;left:20px;top:210px;width:100px;height:150px}
.mbot{position:absolute;left:35px;top:282px;width:26px;height:38px;transition:transform 1.6s ease-in,opacity 1.6s ease-in,filter .8s;filter:drop-shadow(0 0 4px rgba(240,201,122,.5))}
.mbot.glow{filter:drop-shadow(0 0 14px rgba(255,233,176,1))}
.mbot.rise{transform:translate(120px,-250px) scale(.4);opacity:0}
.mdot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff3cf,#f0c97a 55%,rgba(240,201,122,0) 72%);box-shadow:0 0 18px 6px rgba(240,201,122,.6);left:86px;top:314px;opacity:0;transition:left 1s ease-in-out,top 1s ease-in-out,opacity .3s;pointer-events:none}
.mcap{min-height:3.4em;text-align:center;font-family:var(--serif);font-size:18px}
.final{font-family:var(--serif);font-size:20px;line-height:1.9;text-align:center}

/* wall */
.wall{position:relative;height:420px;margin:8px -6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(70% 60% at 50% 40%,rgba(27,42,99,.55),transparent)}
.st{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--moon)}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:#dfe6ff;box-shadow:0 0 12px 3px rgba(223,230,255,.6);transition:all .3s}
.st.mine::before{width:16px;height:16px;background:var(--gold);box-shadow:0 0 24px 8px rgba(240,201,122,.7)}
.st.cur::before{width:15px;height:15px;box-shadow:0 0 22px 7px rgba(255,255,255,.7)}
.st.mine.cur::before{width:20px;height:20px}
.st.echoed::before{background:#ffe9b0;box-shadow:0 0 16px 5px rgba(255,233,176,.75)}
.st.ring::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;border:1px solid var(--gold);animation:ring 1.7s ease-out forwards;pointer-events:none}
@keyframes ring{to{transform:scale(5);opacity:0}}
.sheet{border:1px solid var(--line);border-top:2px solid var(--gold-d);background:rgba(7,13,36,.7);padding:16px;border-radius:0 0 12px 12px;min-height:130px}
.sheet blockquote{margin:8px 0;font-family:var(--serif);font-size:17px;line-height:1.9;overflow-wrap:anywhere}
.gest{display:grid;grid-template-columns:1fr;gap:8px}
.opt.g{padding:10px 14px;min-height:60px;line-height:1.5}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(3,6,18,.78);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#mbox{width:100%;max-width:480px;max-height:86dvh;overflow:auto;background:var(--deep);border-top:2px solid var(--gold-d);border-radius:18px 18px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
#mbox ul{padding-left:20px;margin:0 0 1em} #mbox li{margin-bottom:6px}

/* 图腾占位（原创通用符号，非官方图腾）：圆形徽章，光晕是圆形渐隐，不会出现方块边缘 */
.tm{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--line);background:rgba(7,13,36,.45);flex:none;overflow:hidden;transition:background .8s,border-color .8s,box-shadow .8s}
.tm.on{border:1.5px solid var(--gold-d);background:radial-gradient(circle,rgba(240,201,122,.30) 0%,rgba(240,201,122,.10) 55%,rgba(7,13,36,.55) 100%);box-shadow:0 0 18px rgba(240,201,122,.35)}
.tm.reveal{animation:reveal 1.8s ease-out}
@keyframes reveal{0%{transform:scale(.55);opacity:.15;box-shadow:0 0 0 rgba(240,201,122,0)}60%{transform:scale(1.12);opacity:1;box-shadow:0 0 34px rgba(240,201,122,.8)}100%{transform:scale(1)}}
.tt{width:100%;height:100%;display:block}
.tt .th{fill:none;stroke:var(--mist);stroke-width:2.6;stroke-dasharray:3 5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.tt .ax{fill:none;stroke:var(--mist);stroke-width:1.4;stroke-dasharray:2 4;opacity:.5}
.tt.on .th{stroke:var(--gold);stroke-width:8;stroke-dasharray:none;opacity:1}
.tt.on .th.tf{fill:var(--gold);stroke-width:3}
.tt.on .th.fine{stroke-width:3.5}
.tt.on .ax{stroke:var(--gold-d);opacity:.8}
.tt.on .gl{filter:drop-shadow(0 0 5px rgba(240,201,122,.9))}
.totems{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px;text-align:center}
.totems div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--mist);line-height:1.4}
.totems div.on{color:var(--gold)}
.totems .tm{width:60px;height:60px}
.trow{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-size:14px;color:var(--mist)}
.trow .tm{width:56px;height:56px}
.bp-card .d .tm{width:32px;height:32px;margin-top:6px}
@media (min-width:700px){
  #shell{max-width:600px}
  .map{height:470px}
  .wall{height:480px}
  h1{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<div id="shell">

</div>

<script>
(()=>{
'use strict';
/* =====================================================================

const LANG='zh';
const ZH={

/* 01 序幕 */
'intro.disc':'故事灵感来自创作者的一场梦。这里是一段象征性的自我探索旅程。',
'intro.sub':'没有对错，没有等级，也没有倒计时。首轮约 8–12 分钟，随时可以停下。',

/* 02 接住四颗光 */
'dream.title':'接住四颗光','dream.help':'按你的节奏点它们，先点哪一颗都可以，它们最后会排成同一串数字。',
'dream.done':'它们在你面前排成：1320。','dream.done2':'远处，一道门亮了起来。','dream.next':'走向那扇门','dream.light':'光 {d}',
/* 03 门前 */
'gate.title':'门前','gate.help':'门还关着。回答只是此刻的站位，不会改变你的蓝图，也可以选择先不回答。',
'gate.skip':'先不回答','gate.prog':'第 {n} 问，共 3 问',
'gate.q0':'走到门前，你此刻的身体更像哪一种？','gate.q0.a':['有一点紧','很平静','有点困','说不清'],
'gate.q1':'你是怎么走到这里的？','gate.q1.a':['出于好奇','想歇一会儿','想更理解自己','只是路过'],

const Kingdom1320Bridge={
  apiBase(){
    const q=new URLSearchParams(location.search).get('api');

  },
  classify(res,data){
    const code=(data&&((data.error&&data.error.code)||data.error_code||data.code||data.status))||'';
    const s=String(code).toLowerCase();
    if(res&&(res.status===401||res.status===403||res.status===404))return 'unconnected';
    if(s.indexOf('unauth')>=0||s.indexOf('forbidden')>=0)return 'unconnected';
    if(s.indexOf('valid')>=0||s.indexOf('consent')>=0||s.indexOf('unsupported')>=0||(res&&res.status===400))return 'validation_failed';
    if(s.indexOf('unavail')>=0||s.indexOf('rate')>=0||s.indexOf('internal')>=0||(res&&(res.status===429||res.status>=500)))return 'temporarily_unavailable';
    if(res&&!res.ok)return 'unconnected';

  },
  mapOfficial(raw){
    if(!raw||!raw.foundation){

      const err=new Error('validation_failed');err.code='validation_failed';throw err;
    }
    const foundation={};
    ORDER.forEach(id=>{
      const bag=raw.foundation;
      const seg=bag[id]||bag[id.toUpperCase()];
      if(!seg||!seg.code){const err=new Error('validation_failed');err.code='validation_failed';throw err;}
      foundation[id]={
        code:seg.code,

      provenance:'official',
      algorithmVersion:raw.api_version||null,
      contentVersion:raw.profile_version||null,

      blueprintId:raw.blueprint_id||null,

        method:'POST',

          birth_date:isoBirth(b),

let ac=null;
function sfx(kind){
  if(!S.sfx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const n=ac.currentTime;
    const tn=(f,t0,d,g)=>{const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.value=f;
      gn.gain.setValueAtTime(0.0001,n+t0);gn.gain.exponentialRampToValueAtTime(g,n+t0+0.03);gn.gain.exponentialRampToValueAtTime(0.0001,n+t0+d);
      o.connect(gn);gn.connect(ac.destination);o.start(n+t0);o.stop(n+t0+d+0.05);};
    if(kind==='lamp'){tn(660,0,1.7,.05);tn(990,.16,1.9,.035);tn(1320,.34,2,.02);}
    if(kind==='gesture'){tn(520,0,1.2,.04);tn(780,.1,1.5,.025);}
    if(kind==='rise'){tn(440,0,2.4,.03);tn(880,.4,2.6,.025);tn(1320,.9,2.6,.015);}
    if(kind==='step'){
      const len=Math.floor(ac.sampleRate*0.07),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
      const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      f.type='lowpass';f.frequency.value=420;g.gain.value=0.12;src.buffer=buf;src.connect(f);f.connect(g);g.connect(ac.destination);src.start(n);
    }
  }catch(e){}
}
function tone(on){
  stopTone();if(!on)return;
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=180+(S.sc.s3.v??40)*1.6;g.gain.value=0.035;
    o.connect(g);g.connect(c.destination);o.start();audio={c,o,g};
  }catch(e){}
}

const doorHtml=(open,pw)=>`<div class="door ${open?'open':''}" id="door"><i></i><i></i>${pw!==undefined?`<div class="sock" id="sock" aria-hidden="true">${[0,1,2,3].map(k=>`<u class="${pw[k]?'on':''}">${pw[k]||''}</u>`).join('')}</div>`:''}</div>`;

/* Screen 01 梦境序幕 */
V.intro=()=>{
  const dl=a=>`style="animation-delay:${S.seenPro?0:a}s"`;
  return `<section class="scr pro" style="padding-top:5vh">
  <div class="wk-hero big">${walker({},'wake')}</div>
  ${[[14,24],[78,12],[88,52],[8,60]].map(([l,tp],k)=>`<i class="fd" aria-hidden="true" style="left:${l}%;top:${tp}%;animation-delay:${S.seenPro?0:1+k*.7}s,${S.seenPro?0:3+k*.7}s"></i>`).join('')}
  <h1>${t('brand')}</h1>
  <p class="small">${t('intro.disc')}</p>
  <p class="lead pl" ${dl(.5)}>${t('intro.l1')}</p>
  <p class="lead pl" ${dl(2.4)}>${t('intro.l2')}</p>
  <p class="cap">${t('intro.sub')}</p>
  <div class="row"><button class="btn ${S.seenPro?'ghost':''}" data-act="enter">${t('intro.enter')}</button><button class="btn ${S.seenPro?'':'link'}" data-act="skipPro">${t('intro.skip')}</button></div>
</section>`;};

/* Screen 02 接住四颗光 */
const FL=[{l:10,t:12},{l:66,t:28},{l:26,t:62},{l:72,t:72}];
V.dream=()=>{
  const all=S.dream.length===4;
  return `<section class="scr"><h2>${t('dream.title')}</h2>
  <p class="small">${all?'':t('dream.help')}</p>
  <div class="slots" id="slots">${ORDER.map((id,k)=>`<div class="slot ${S.dream.includes(k)?'on':''}" data-slot="${k}">${DIGIT[id]}</div>`).join('')}</div>
  ${all?`<p class="lead" style="text-align:center">${t('dream.done')}</p><p class="small" style="text-align:center">${t('dream.done2')}</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="dreamNext">${t('dream.next')}</button></div>`
  :`<div class="stage">${ORDER.map((id,k)=>`<button class="fl" style="left:${FL[k].l}%;top:${FL[k].t}%;animation-delay:${-k*1.7}s" data-act="dreamTake" data-i="${k}" aria-label="${t('dream.light',{d:DIGIT[id]})}">${DIGIT[id]}</button>`).join('')}</div>`}
  </section>`;
};

/* Screen 03 门前觉察 */
V.gate=()=>{
  const q=S.gq,opts=t('gate.q'+q+'.a');
  return `<section class="scr">${doorHtml(false)}
  <h2>${t('gate.title')}</h2><p class="small">${t('gate.help')}</p>
  <p class="cap">${t('gate.prog',{n:q+1})}</p>
  <p class="lead">${t('gate.q'+q)}</p>
  <div class="stack">${opts.map((o,k)=>`<button class="opt" data-act="gateAns" data-v="${k}">${esc(o)}</button>`).join('')}
  <button class="opt quiet" data-act="gateAns" data-v="-1">${t('gate.skip')}</button></div></section>`;
};

/* Screen 04 密码之门 */
V.pw=()=>`<section class="scr">${doorHtml(S.pwOk,S.pw)}
  <h2>${t('pw.title')}</h2><p class="small">${t('pw.help')}</p>
  <div class="sr" id="pwsr" aria-live="polite">${t('pw.sr',{n:S.pw.length})}</div>
  <div class="err" id="pwerr" role="alert"></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pwKey" data-v="${n}">${n}</button>`).join('')}
  <button class="sm" data-act="pwClear">${t('pw.clear')}</button><button data-act="pwKey" data-v="0">0</button><button class="sm" data-act="pwDel">${t('pw.del')}</button></div>
</section>`;

/* Screen 05 蓝图钥匙 */
const dim=(y,m)=>new Date(y,m,0).getDate();
function dayOpts(){
  const y=+S.bd.y||2000,m=+S.bd.m||1,n=dim(y,m);
  let h=`<option value="">${t('birth.d')}</option>`;
  for(let d=1;d<=n;d++)h+=`<option value="${d}" ${+S.bd.d===d?'selected':''}>${d}</option>`;
  return h;
}
V.birth=()=>{
  const ny=new Date().getFullYear();let ys=`<option value="">${t('birth.y')}</option>`;
  for(let y=ny;y>=1920;y--)ys+=`<option value="${y}" ${+S.bd.y===y?'selected':''}>${y}</option>`;
  let ms=`<option value="">${t('birth.m')}</option>`;
  for(let m=1;m<=12;m++)ms+=`<option value="${m}" ${+S.bd.m===m?'selected':''}>${m}</option>`;
  return `<section class="scr"><h2>${t('birth.title')}</h2><p class="lead" style="font-size:18px">${t('birth.help')}</p><p class="small">${t('birth.help2')}</p>
  <div class="grid2" style="grid-template-columns:1.3fr 1fr 1fr">
   <div><label class="f" for="by">${t('birth.y')}</label><select id="by" data-bind="by">${ys}</select></div>
   <div><label class="f" for="bm">${t('birth.m')}</label><select id="bm" data-bind="bm">${ms}</select></div>
   <div><label class="f" for="bd">${t('birth.d')}</label><select id="bd" data-bind="bd">${dayOpts()}</select></div></div>
  <label class="small" style="display:block;margin-top:14px"><input type="checkbox" data-bind="birthConsent" ${S.birthConsent?'checked':''}> ${t('birth.consent')}</label>
  ${S.birthBusy?`<p class="cap" role="status">${t('birth.loading')}</p>`:''}
  <div class="err" id="berr" role="alert">${S.birthErr?esc(birthErrText(S.birthErr)):''}</div>
  <div class="row"><button class="btn" data-act="birthGo" ${S.birthBusy?'disabled':''}>${t('birth.go')}</button></div>
  <div class="row" style="margin-top:4px"><button class="btn link" data-act="birthSample" ${S.birthBusy?'disabled':''}>${t('birth.sample')}</button></div>
</section>`;
};

/* Screen 06 四境地图 */
// 旅人站在节点圆圈的一侧，完全落在节点名称区域之外（节点宽 92px，旅人宽 58px），避免遮挡名称与「已走过」。
const WK_SIDE={s1:'r',s3:'l',s2:'r',s0:'l'};
const wkPos=id=>{const p=POS[id],r=WK_SIDE[id]==='r';return `left:calc(${p.x}% ${r?'+ 50px':'- 108px'});top:calc(${p.y}% - 62px)`;};
V.map=()=>{
  const n=visitedN();
  const pts=ORDER.map(i=>POS[i].x+','+POS[i].y).join(' ');
  const to=S.lastDone||'s1',from=S.walkAt||to;
  const lit=S.lastLit;
  const status=i=>S.visited[i]?t('map.visited'):t('map.todo');
  return `<section class="scr"><h2>${t('map.title')}</h2><p class="small">${t('map.order')}</p>
  ${lit?`<p class="note" role="status">${t('lamp.lit',{s:lit.toUpperCase()+' '+t('scene.'+lit+'.name')})}</p>`:''}
  <div class="map" id="map" data-guided="${S.guided||''}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>
  ${ORDER.map(i=>`<button class="node ${S.visited[i]?'done':''}" id="node-${i}" style="left:${POS[i].x}%;top:${POS[i].y}%" data-act="scene" data-id="${i}" aria-label="${DIGIT[i]} ${i.toUpperCase()} ${t('scene.'+i+'.name')}，${status(i)}"><b>${DIGIT[i]}</b><span>${t('scene.'+i+'.name')}</span>${S.visited[i]?`<em>${t('map.visited')}</em>`:''}</button>`).join('')}
  ${far(92,80)}${far(5,60)}
  <div class="wk" id="wk" style="${wkPos(from)}">${walker(S.visited,'walk')}</div></div>
  ${lampCap(S.visited)}<p class="cap" style="text-align:center">${t('lamp.note')}</p>
  ${totemRow(S.visited,lit)}<p class="cap" style="text-align:center">${t('totem.note')}</p>
  <p class="small">${t('map.prog',{n})}</p>
  ${n===4&&!S.gathered?`<p class="lead">${t('map.done')}</p>`:''}
  <div class="row" style="margin-top:8px">
   ${n===4&&!S.gathered?`<button class="btn" data-act="gather" id="gatherBtn">${t('map.gather')}</button>`:''}
   ${n<4?`<button class="btn ghost" data-act="guide">${t('map.guide')}</button>`:''}
   <button class="btn ghost" data-act="textMap" aria-expanded="${S.textMap}" aria-controls="tmap">${S.textMap?t('map.textHide'):t('map.text')}</button>
  </div>
  ${S.guided&&n<4?`<p class="note" role="status">${t('map.guideNote',{s:t('scene.'+S.guided+'.name')})}</p>`:''}
  <div id="tmap" ${S.textMap?'':'hidden'} style="margin-top:12px"><ul style="list-style:none;padding:0;margin:0">${ORDER.map(i=>`<li><button class="legend" data-act="scene" data-id="${i}"><span><strong>${i.toUpperCase()}</strong>${t('scene.'+i+'.name')}：${t('scene.'+i+'.tag')}</span><em>${status(i)}</em></button></li>`).join('')}</ul></div>
  ${S.gathered?`<div class="row"><button class="btn" data-act="showBp">${t('map.bp')}</button><button class="btn ghost" data-act="toBottle">${t('map.bottle')}</button><button class="btn ghost" data-act="toWall0">${t('map.wall')}</button></div>`:''}
</section>`;
};

/* ---- 场景外壳 ---- */
const poseFor=id=>id==='s0'?'release':(id==='s3'||id==='s2')?'observe':'stand';
const sceneHead=id=>`<div class="rh"><h2>${t('scene.'+id+'.name')}</h2><span class="code">${id.toUpperCase()} · ${DIGIT[id]}</span></div>
  <p class="small">${t('scene.'+id+'.tag')}</p>
  <p class="trow">${totem(id,S.visited[id])}<span>${S.visited[id]?t('totem.shown'):t('totem.sleep')}（${S.visited[id]&&getFoundation(id).totemAssetUrl?'官方图腾':t('totem.ph')}）</span></p>`;
const backRow=`<div class="row" style="margin-top:24px"><button class="btn link" data-act="toMap">${t('scene.leave')}</button></div>`;
function mirrorHtml(id,lines){
  const s=S.sc[id];
  return `<div class="card fixed"><h3>${t('mirror.head')}</h3>${lines.map(l=>`<p style="margin:0 0 8px">${l}</p>`).join('')}</div>
    <label class="f" for="note">${t('note.label')}</label>
    <textarea id="note" data-bind="note" placeholder="${t('note.ph')}" maxlength="140">${esc(s.note||'')}</textarea>
    <div class="row"><button class="btn" data-act="finish">${t('finish')}</button></div>`;
}
function syncWaveA11y(v){
  const w=waveWord(v),c=$('#wave'),sl=$('#sl');
  if(c)c.setAttribute('aria-label',t('wave.alt',{w}));
  if(sl)sl.setAttribute('aria-valuetext',w);
}
function waveWord(v){v=+v;return t('s3.w'+(v<25?0:v<50?1:v<75?2:3));}

V.scene=()=>{
  const id=S.cur,s=S.sc[id];let body='';
  if(S.visited[id]&&!s.replaying){
    return `<section class="scr"><div class="wk-sm">${walker(S.visited,poseFor(id))}</div>${sceneHead(id)}
    <div class="card fixed"><h3>${t('replay.title')}</h3><p style="margin:0">${esc(liveText(id))}</p></div>
    <p class="cap">${t('replay.note')}</p>
    <div class="row"><button class="btn" data-act="redo">${t('replay.btn')}</button></div>${backRow}</section>`;
  }
  if(id==='s1'){
    if(s.step==='mirror'){
      body=mirrorHtml(id,[`${esc(t('sym.'+s.sym))}：${t('sym.'+s.sym+'.l')}`,t('s1.m.'+s.act)+(s.act==='rename'?` ${t('bp.mine',{x:esc(s.ren)})}`:''),t('s1.mirror')]);
    }else if(s.step==='act'){
      body=`<div class="bigsym">${t('sym.'+s.sym)}</div><p class="lead" style="text-align:center">${t('sym.'+s.sym+'.l')}</p><p class="cap" style="text-align:center"><span class="tag sample">${t('s1.sampleTag')}</span></p>
      <p class="lead" style="margin-top:16px">${t('s1.q')}</p>
      <div class="stack">${S1_ACTS.map(a=>`<button class="opt ${a==='unsure'?'quiet':''} ${s.reveal&&a==='rename'?'sel':''}" data-act="s1act" data-v="${a}">${t('s1.a.'+a)}</button>`).join('')}</div>
      ${s.reveal?`<label class="f" for="ren">${t('s1.my')}</label><input type="text" id="ren" data-bind="ren" maxlength="16" placeholder="${t('s1.renPh')}" value="${esc(s.ren||'')}"><p class="cap">${t('s1.renNote')}</p><div class="err" id="renerr" role="alert"></div><div class="row" style="margin-top:6px"><button class="btn" data-act="s1renOk">${t('s1.renOk')}</button></div>`:''}
      <div class="row" style="margin-top:8px"><button class="btn link" data-act="s1Back">${t('s1.change')}</button></div>`;
    }else{
      body=`<p class="lead">${t('s1.pick')}</p><div class="grid2">${SYMS.map(k=>`<button class="sym" data-act="pickSym" data-v="${k}">${t('sym.'+k)}</button>`).join('')}</div>`;
    }
  }
  if(id==='s3'){
    const v=s.v??40;
    if(s.step==='mirror'){
      body=mirrorHtml(id,[t('s3.m.'+s.act,{w:waveWord(v)})]);
    }else{
      body=`<p class="lead">${t('s3.help')}</p>
      <canvas class="wave" id="wave" role="img" aria-label="${t('wave.alt',{w:waveWord(v)})}"></canvas>
      <label class="f" for="sl">${t('s3.label')}：<span id="wlab">${waveWord(v)}</span></label>
      <input type="range" id="sl" min="0" max="100" value="${v}" aria-valuetext="${waveWord(v)}" data-bind="slider">
      <p class="cap">${t('s3.fine')}</p>
      <div class="grid2"><button class="btn ghost" data-act="slow">${t('s3.slower')}</button><button class="btn ghost" data-act="fast">${t('s3.faster')}</button></div>
      <div class="stack" style="margin-top:12px"><button class="opt" data-act="s3act" data-v="stay">${t('s3.stay')}</button><button class="opt" data-act="s3act" data-v="observe">${t('s3.observe')}</button>
      <button class="opt quiet" id="sndBtn" data-act="snd">${t('s3.snd.on')}</button></div>
      <p class="cap">${t('s3.snd.note')}</p>`;
    }
  }
  if(id==='s2'){
    if(s.step==='mirror'){
      body=mirrorHtml(id,[`${t('rel.'+s.rel)}`,t('s2.m.'+s.act)+(s.act==='say'&&s.say?` ${t('bp.my2',{x:esc(s.say)})}`:''),t('s2.mirror')]);
    }else if(s.step==='act'){
      body=`<p class="bigsym" style="font-size:28px">${t('rel.'+s.rel)}</p><p class="lead">${t('s2.act')}</p>
      <div class="stack">${S2_ACTS.map(a=>`<button class="opt ${a==='none'?'quiet':''} ${s.reveal&&a==='say'?'sel':''}" data-act="s2act" data-v="${a}">${t('s2.a.'+a)}</button>`).join('')}</div>
      ${s.reveal?`<label class="f" for="say">${t('s2.my')}</label><textarea id="say" data-bind="say" maxlength="140" placeholder="${t('s2.sayPh')}">${esc(s.say||'')}</textarea><div class="row" style="margin-top:6px"><button class="btn" data-act="s2sayOk">${t('s2.sayOk')}</button></div>`:''}`;
    }else{
      body=`<p class="lead">${t('s2.pick')}</p><div class="stack">${RELS.map(r=>`<button class="opt ${r==='none'?'quiet':''}" data-act="pickRel" data-v="${r}">${t('rel.'+r)}</button>`).join('')}</div>`;
    }
  }
  if(id==='s0'){
    if(s.step==='mirror'){
      body=mirrorHtml(id,[t(s.skipped?'s0.b.skip':'s0.b.done'),t('s0.m.'+s.act)+(s.act==='word'&&s.word?` ${t('bp.word',{x:esc(s.word)})}`:''),t('s0.mirror')]);
    }else if(s.step==='act'){
      body=`<p class="lead">${t('s0.after')}</p>
      <div class="stack">${S0_ACTS.map(a=>`<button class="opt ${a==='wait'||a==='back'?'quiet':''} ${s.reveal&&a==='word'?'sel':''}" data-act="s0act" data-v="${a}">${t('s0.a.'+a)}</button>`).join('')}</div>
      ${s.reveal?`<label class="f" for="word">${t('s0.my')}</label><input type="text" id="word" data-bind="word" maxlength="12" placeholder="${t('s0.wordPh')}" value="${esc(s.word||'')}"><div class="row" style="margin-top:6px"><button class="btn" data-act="s0wordOk">${t('s0.wordOk')}</button></div>`:''}`;
    }else{
      body=`<p class="lead">${t('s0.intro')}</p><div class="breath" id="br" aria-live="polite"><span id="brl"></span></div>
      <div class="row" style="justify-content:center"><button class="btn" id="brGo" data-act="breatheStart">${t('s0.start')}</button><button class="btn link" data-act="breatheSkip">${t('s0.skip')}</button></div>`;
    }
  }
  return `<section class="scr"><div class="wk-sm">${walker(S.visited,poseFor(id))}</div>${sceneHead(id)}${body}${backRow}</section>`;
};

/* 简版蓝图 */
function liveText(id){
  const s=S.sc[id];if(!S.visited[id])return t('bp.none');
  let a='';
  if(id==='s1')a=t('bp.sym.l',{n:t('sym.'+s.sym),a:t('s1.a.'+s.act)})+(s.act==='rename'?'；'+t('bp.mine',{x:s.ren}):'');
  if(id==='s3')a=t('bp.s3.l',{w:waveWord(s.v??40),a:t('s3.'+s.act)});
  if(id==='s2')a=t('bp.rel.l',{n:t('rel.'+s.rel),a:t('s2.a.'+s.act)})+(s.act==='say'&&s.say?'；'+t('bp.my2',{x:s.say}):'');
  if(id==='s0')a=t('bp.blank.l',{a:t('s0.a.'+s.act)})+(s.act==='word'&&s.word?'；'+t('bp.word',{x:s.word}):'')+'；'+t(s.skipped?'s0.b.skip':'s0.b.done');
  return a+(s.note?'；'+t('bp.say',{x:s.note}):'');
}
/* ExplorationRecord[]：玩家选择只进入这里，不参与蓝图计算 */
function explorationRecords(){
  return ORDER.map(id=>{const s=S.sc[id];
    return {module:id,sceneVersion:SCENE_VERSION,choice:S.visited[id]?(s.act||null):null,
      playerWords:[s.ren,s.say,s.word,s.note].filter(Boolean).join(' / '),completed:!!S.visited[id]};});
}
const birthKey=()=>{const b=S.birth;return `${b.y} · ${String(b.m).padStart(2,'0')} · ${String(b.d).padStart(2,'0')}`;};
function birthErrText(code){
  if(code==='validation_failed')return t('birth.validation');
  if(code==='temporarily_unavailable')return t('birth.unavailable');
  return t('birth.unconnected');
}
function llmErrText(code){
  if(code==='validation_failed')return t('llm.validation');
  if(code==='temporarily_unavailable')return t('llm.unavailable');
  return t('llm.unconnected');
}
V.bp=()=>{
  const official=S.bp&&S.bp.provenance==='official';
  const gateAns=S.gate.map((g,k)=>`<li>${t('gate.q'+k)} → ${g<0?t('bp.noAns'):esc(t('gate.q'+k+'.a')[g])}</li>`).join('');
  const llm=S.llm||{};
  return `<section class="scr"><h2>${t('bp.title')}</h2>
  <div class="wk-hero">${walker(S.visited,'stand')}</div>${lampCap(S.visited)}
  <div class="card fixed"><h3>${t('bp.fixed')}</h3><span class="tag${official?'':' sample'}">${official?t('bp.provOff'):t('bp.sampleTag')}</span>
   <p class="small" style="margin-top:8px">${t('bp.fixedHelp')}</p>
   <p class="cap">${t('bp.key',{k:birthKey()})}${S.birthSample?' '+t('bp.keySample'):''}</p>
   ${ORDER.map(i=>{const f=getFoundation(i);return `<div class="bp-card"><div class="d">${DIGIT[i]}<small>${i.toUpperCase()}</small>${totem(i,!!S.visited[i])}</div><div><strong>${t('scene.'+i+'.name')}（${t('scene.'+i+'.en')}）：${esc(f.name)}</strong><br><span class="small">${esc(f.shortMeaning)}</span><br><span class="cap">${f.code?t('bp.code',{c:esc(f.code)}):t('bp.codeNone')}</span></div></div>`;}).join('')}
   <p class="cap" style="margin-top:10px">${t('bp.ver',{a:S.bp.algorithmVersion||t('bp.verNone'),c:esc(S.bp.contentVersion||'—'),p:t(official?'bp.provOff':'bp.provDemo')})}<br>${t('bp.totemNote')}</p></div>
  <div class="card"><h3>${t('bp.live')}</h3><p class="small">${t('bp.liveHelp')}</p>
   ${ORDER.map(i=>`<p style="margin:0 0 10px"><strong>${t('scene.'+i+'.name')}</strong><br><span class="small">${esc(liveText(i))}</span></p>`).join('')}
   ${S.gate.length?`<details><summary>${t('bp.gate')}</summary><ul class="small">${gateAns}</ul></details>`:''}</div>
  <div class="card"><h3>${t('llm.title')}</h3><p class="small">${t('llm.help')}</p>
   ${llm.text?`<p class="lead">${esc(llm.text)}</p>`:''}
   ${llm.busy?`<p class="cap" role="status">${t('llm.loading')}</p>`:''}
   ${llm.err?`<p class="err" role="alert">${esc(llm.err)}</p>`:''}
   <div class="row"><button class="btn ghost" data-act="llmReflect" ${llm.busy?'disabled':''}>${t('llm.go')}</button></div></div>
  <p class="note">${t('bp.sep')}</p>

function afterRender(){

      [0,500,1000].forEach(ms=>S.timers.push(setTimeout(()=>{if(S.screen==='map')sfx('step');},ms)));
    }

  }

  if(S.screen==='wall')echoFx();

function startWave(){
  const c=$('#wave');if(!c)return;const ctx=c.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr;
  let ph=0,last=performance.now();
  const frame=now=>{
    const v=(S.sc.s3.v??40)/100,dt=(now-last)/1000;last=now;
    ph+=dt*(0.6+v*5);
    ctx.clearRect(0,0,W,H);
    for(let k=0;k<3;k++){
      ctx.beginPath();
      const amp=H*(0.12+0.1*(1-v)+k*0.02),fr=(2+v*7)*(1+k*0.35);
      for(let x=0;x<=W;x+=4){
        const y=H/2+Math.sin(x/W*fr*Math.PI*2+ph+k)*amp*(1-k*0.25);
        x?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.strokeStyle=`rgba(240,201,122,${0.85-k*0.25})`;ctx.lineWidth=(2.2-k*0.5)*dpr;ctx.stroke();
    }
    if(!reduced())raf=requestAnimationFrame(frame);
  };
  frame(performance.now());
}
function dustTrail(w){
  if(reduced())return;
  const map=w.parentElement;let k=0;
  const step=()=>{
    if(S.screen!=='map'||k++>12)return;
    const a=w.getBoundingClientRect(),b=map.getBoundingClientRect(),d=document.createElement('i');
    d.className='dust';d.style.left=(a.left-b.left+a.width/2+Math.random()*16-8)+'px';d.style.top=(a.top-b.top+a.height-8+Math.random()*8-4)+'px';
    map.appendChild(d);setTimeout(()=>d.remove(),1800);S.timers.push(setTimeout(step,120));
  };
  step();
}

/* 生命流星：旅人托起瓶 → 灯的一束光入瓶（灯仍亮）→ 升空 → 落入星墙 */
function drawMeteorEnd(){
  const c=$('#mc');if(!c)return;const ctx=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
  const W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr;
  const ex=W*0.85,ey=H*0.18;
  const g=ctx.createRadialGradient(ex,ey,0,ex,ey,40*dpr);
  g.addColorStop(0,'rgba(255,240,200,1)');g.addColorStop(.25,'rgba(240,201,122,.6)');g.addColorStop(1,'rgba(240,201,122,0)');
  ctx.clearRect(0,0,W,H);ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,40*dpr,0,7);ctx.fill();
}
function runMeteorCanvas(){
  const c=$('#mc');if(!c)return;const ctx=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
  const W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr;
  const sx=W*0.15,sy=H*0.79,ex=W*0.85,ey=H*0.18;
  const pt=u=>({x:sx+(ex-sx)*u,y:sy+(ey-sy)*Math.pow(u,0.7)-H*0.12*Math.sin(u*Math.PI)});
  const T=2800,t0=performance.now();
  const f=now=>{
    const u=Math.min((now-t0)/T,1);ctx.clearRect(0,0,W,H);
    for(let k=0;k<26;k++){
      const p=pt(Math.max(u-k*0.014,0));
      ctx.fillStyle=`rgba(255,236,190,${(1-k/26)*0.8})`;
      ctx.beginPath();ctx.arc(p.x,p.y,(5-k*0.17)*dpr,0,7);ctx.fill();
    }
    if(u<1&&S.screen==='meteor')requestAnimationFrame(f);else if(S.screen==='meteor')drawMeteorEnd();
  };
  requestAnimationFrame(f);
}
function meteorFinal(){

const A={
  enter(){S.seenPro=true;go('dream');},
  skipPro(){S.seenPro=true;S.dream=[0,1,2,3];go('dream');},
  dreamTake(d){
    const i=+d.i;if(S.dream.includes(i))return;S.dream.push(i);

  dreamNext(){go('gate');},
  gateAns(d){S.gate[S.gq]=+d.v;if(S.gq<2){S.gq++;render();window.scrollTo(0,0);}else go('pw');},
  pwKey(d){pwPush(d.v);},
  pwClear(){S.pw='';updatePw();},
  pwDel(){S.pw=S.pw.slice(0,-1);updatePw();},
  birthGo(){
    const y=+S.bd.y,m=+S.bd.m,dd=+S.bd.d;const e=$('#berr');
    if(!y||!m||!dd||new Date(y,m-1,dd)>new Date()){e.textContent=t('birth.err');return;}

  },
  birthSample(){setBirth({...DEMO.sampleBirth},true);},
  llmReflect(){
    if(S.llm&&S.llm.busy)return;
    if(!visitedN()){S.llm={err:t('llm.empty')};render();return;}
    const choices=ORDER.filter(id=>S.visited[id]).map(id=>{
      const s=S.sc[id];

      if(id==='s2'&&s.rel)item.relation=s.rel;
      return item;
    });
    S.llm={busy:true};render();
    Kingdom1320Bridge.reflect({
      locale:'zh-CN',
      purpose:'soulsync_kingdom',
      choices
    }).then(text=>{S.llm={text};render();}).catch(e=>{
      S.llm={err:llmErrText((e&&e.code)||'unconnected')};render();
    });
  },
  scene(d){toScene(d.id);},
  toMap(){leaveScene();},
  redo(){
    const id=S.cur;

  },
  textMap(){S.textMap=!S.textMap;render();},
  guide(){
    const pool=ORDER.filter(i=>!S.visited[i]);if(!pool.length)return;
    const id=pool[Math.floor(Math.random()*pool.length)];S.guided=id;
    const map=$('#map'),w=$('#wk'),node=$('#node-'+id);if(map)map.dataset.guided=id;
    if(!map||!w||!node||reduced()){toScene(id);return;}
    const mb=map.getBoundingClientRect(),wb=w.getBoundingClientRect(),nb=node.getBoundingClientRect();
    const orb=document.createElement('div');orb.className='lampfx';
    orb.style.left=(wb.left-mb.left+wb.width/2)+'px';orb.style.top=(wb.top-mb.top+10)+'px';map.appendChild(orb);
    node.classList.add('pulse');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{orb.style.left=(nb.left-mb.left+nb.width/2)+'px';orb.style.top=(nb.top-mb.top+29)+'px';}));
    sfx('gesture');
    S.timers.push(setTimeout(()=>toScene(id),1500));
  },
  gather(){
    const map=$('#map'),w=$('#wk');
    const done=()=>{S.gathered=true;sfx('lamp');go('bp');};
    if(!map||!w||reduced()){done();return;}
    const mb=map.getBoundingClientRect(),wb=w.getBoundingClientRect();
    const tx=wb.left-mb.left+wb.width*0.66,ty=wb.top-mb.top+wb.height*0.69;
    ORDER.forEach(id=>{
      const nb=$('#node-'+id).getBoundingClientRect(),d=document.createElement('div');d.className='lampfx';
      d.style.left=(nb.left-mb.left+nb.width/2)+'px';d.style.top=(nb.top-mb.top+29)+'px';map.appendChild(d);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.left=tx+'px';d.style.top=ty+'px';}));
    });
    $('#gatherBtn').disabled=true;
    S.timers.push(setTimeout(done,1600));
  },
  /* S1 */
  pickSym(d){const s=S.sc.s1;s.sym=d.v;s.step='act';s.reveal=false;render();window.scrollTo(0,0);},
  s1Back(){S.sc.s1.step='pick';render();},
  s1act(d){
    const s=S.sc.s1;
    if(d.v==='rename'){s.reveal=true;render();const i=$('#ren');if(i)i.focus();return;}
    s.act=d.v;s.reveal=false;s.step='mirror';render();window.scrollTo(0,0);
  },
  s1renOk(){const s=S.sc.s1,v=(s.ren||'').trim();if(!v){$('#renerr').textContent=t('s1.renErr');return;}s.ren=v;s.act='rename';s.reveal=false;s.step='mirror';render();window.scrollTo(0,0);},
  /* S3 */
  slow(){nudge(-15);},fast(){nudge(15);},
  s3act(d){const s=S.sc.s3;if(s.v===undefined)s.v=40;s.act=d.v;s.step='mirror';stopWave();render();window.scrollTo(0,0);},
  snd(){
    const s=S.sc.s3;s.snd=!s.snd;tone(s.snd);
    const b=$('#sndBtn');if(b)b.textContent=s.snd?t('s3.snd.skip'):t('s3.snd.on');
  },
  /* S2 */
  pickRel(d){
    const s=S.sc.s2;s.rel=d.v;s.reveal=false;
    if(d.v==='none'){s.act='none';s.step='mirror';}else s.step='act';
    render();window.scrollTo(0,0);
  },
  s2act(d){
    const s=S.sc.s2;
    if(d.v==='say'){s.reveal=true;render();const i=$('#say');if(i)i.focus();return;}
    s.act=d.v;s.reveal=false;s.step='mirror';render();window.scrollTo(0,0);
  },
  s2sayOk(){const s=S.sc.s2;s.say=(s.say||'').trim();s.act='say';s.reveal=false;s.step='mirror';render();window.scrollTo(0,0);},
  /* S0 */
  breatheStart(){
    const br=$('#br'),lab=$('#brl'),btn=$('#brGo');if(!br||btn.disabled)return;
    btn.disabled=true;br.classList.add('run');let n=0;
    const tick=()=>{
      if(n>=6){const s=S.sc.s0;s.skipped=false;s.step='act';render();return;}
      lab.textContent=n%2===0?t('s0.in'):t('s0.out');n++;S.timers.push(setTimeout(tick,4000));
    };
    tick();
  },
  breatheSkip(){clearTimers();const s=S.sc.s0;s.skipped=true;s.step='act';render();},
  s0act(d){
    const s=S.sc.s0;
    if(d.v==='back'){leaveScene();return;}
    if(d.v==='word'){s.reveal=true;render();const i=$('#word');if(i)i.focus();return;}
    s.act=d.v;s.word='';s.reveal=false;s.step='mirror';render();window.scrollTo(0,0);
  },
  s0wordOk(){const s=S.sc.s0;s.word=(s.word||'').trim();s.act=s.word?'word':'blank';s.reveal=false;s.step='mirror';render();window.scrollTo(0,0);},
  finish(){
    const id=S.cur,first=!S.visited[id];
    S.visited[id]=true;S.sc[id].completed=true;delete S.sc[id].replaying;
    S.lastDone=id;S.lastLit=first?id:null;S.guided=null;
    if(first)sfx('lamp');
    delete S.replayBackup[id];
    go('map');
  },
  showBp(){go('bp');},
  saveCard(){
    const n=$('#cardNote');
    try{exportCard();if(n)n.textContent=t('bp.cardDone')+' '+t('bp.cardNote');}
    catch(e){console.error(e);if(n)n.textContent=t('bp.cardFail');}
  },
  report(){openModal(`<h2 id="mtitle">${t('bp.rep.title')}</h2><p>${t('bp.rep.text')}</p><ul><li>${t('bp.rep.1')}</li><li>${t('bp.rep.2')}</li><li>${t('bp.rep.3')}</li></ul><p class="note">${t('bp.rep.status')}</p>`);},
  toBottle(){go('bottle');},
  toPreview(){
    const b=S.bottle,P=buildPublicStarPayload(S);
    const bad=[['exp',P.experience],['ins',P.insight],['wish',P.wish],['cw',b.cw?b.cwText:'']].filter(([k,v])=>hasContact(v)).map(([k])=>t('btl.f.'+k));
    if(bad.length){b.err=t('btl.contact',{f:bad.join('、')});$('#berr').textContent=b.err;return;}
    if(!P.experience&&!P.insight&&!P.wish){b.err=t('btl.empty');$('#berr').textContent=b.err;return;}
    b.err='';S.consent=false;go('preview');
  },
  regen(){
    S.alias=newAlias();S.consent=false; // 公开内容变了，原同意作废
    render();const b=$('[data-act=regen]');if(b)b.focus();
  },
  keepPrivate(){
    const P=buildPublicStarPayload(S);S.privateStars.push(P);S.published=null;S.wall=[];S.keptNote=true;S.wallSel=-1;
    S.bottle=emptyBottle();go('wall');
  },
  publish(){
    if(!S.consent)return;
    const P=buildPublicStarPayload(S);
    S.published=P;S.wall=[StarWallAdapter.submitLocal(P)];S.keptNote=false;S.wallSel=0;
    S.bottle=emptyBottle();
    go('meteor');
  },
  skipMeteor(){meteorFinal();},
  toWall0(){S.wallSel=S.published?0:-1;go('wall');},
  wallSel(d){S.wallSel=+d.i;render();},
  cwShow(){const s=allStars()[S.wallSel];S.wallCw[s.id]=true;render();},
  gesture(d){
    const s=allStars()[S.wallSel];if(!s||s.mine)return;
    if(S.gest[s.id]===d.v){delete S.gest[s.id];S.echoFx=null;}else{S.gest[s.id]=d.v;S.echoFx=s.id;}
    render();
  },
  restart(){openModal(`<h2 id="mtitle">${t('again')}</h2><p>${t('again.confirm')}</p><div class="row"><button class="btn" data-act="restartYes">${t('again.yes')}</button></div>`);},
  restartYes(){closeModal();const f=S.sfx,sp=S.seenPro;S=fresh();S.sfx=f;S.seenPro=sp;go('intro');}
};
function nudge(d){
  const s=S.sc.s3;s.v=Math.max(0,Math.min(100,(s.v??40)+d));
  const sl=$('#sl');if(sl)sl.value=s.v;const l=$('#wlab');if(l)l.textContent=waveWord(s.v);syncWaveA11y(s.v);
  if(audio)audio.o.frequency.value=180+s.v*1.6;if(reduced())startWave();
}
function pwPush(n){
  if(S.pwOk||S.pw.length>=4)return;
  S.pw+=n;updatePw();
  if(S.pw.length===4)S.timers.push(setTimeout(checkPw,250));
}
function updatePw(){
  const sk=$('#sock');if(!sk)return;
  sk.querySelectorAll('u').forEach((u,i)=>{u.textContent=S.pw[i]||'';u.classList.toggle('on',!!S.pw[i]);});
  const sr=$('#pwsr');if(sr)sr.textContent=t('pw.sr',{n:S.pw.length});
}
function checkPw(){
  if(S.pw==='1320'){
    S.pwOk=true;$('#door').classList.add('open');$('#pwerr').textContent='';$('#pwsr').textContent=t('pw.open');sfx('lamp');
    S.timers.push(setTimeout(()=>go('birth'),reduced()?200:1500));
  }else{
    S.pwErr++;const sk=$('#sock');sk.classList.add('shake');
    $('#pwerr').textContent=S.pwErr>=2?t('pw.err')+' '+t('pw.hint'):t('pw.err');
    S.timers.push(setTimeout(()=>{S.pw='';sk.classList.remove('shake');updatePw();},450));
  }
}

/* ---------- 事件代理 ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=A[b.dataset.act];if(f)f(b.dataset);
});
app.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.bind;if(!k)return;
  if(k==='slider'){S.sc.s3.v=+el.value;const l=$('#wlab');if(l)l.textContent=waveWord(el.value);syncWaveA11y(el.value);
    if(audio)audio.o.frequency.value=180+(+el.value)*1.6;if(reduced())startWave();}
  if(k==='note')S.sc[S.cur].note=el.value;
  if(k==='ren')S.sc.s1.ren=el.value;
  if(k==='say')S.sc.s2.say=el.value;
  if(k==='word')S.sc.s0.word=el.value;
  if(k==='exp'||k==='ins'||k==='wish'||k==='cwText'){
    S.bottle[k]=el.value;
    if((k==='exp'||k==='ins'||k==='wish')&&S.bottle.err&&el.value.trim()){
      S.bottle.err='';const e=$('#berr');if(e)e.textContent='';
    }
  }
});
app.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.bind;if(!k)return;
  if(k==='snip')S.bottle.snip=el.value;
  if(k==='cw'){S.bottle.cw=el.checked;const i=$('#cwt');if(i)i.hidden=!el.checked;}
  if(k==='consent'){S.consent=el.checked;const p=$('#pubBtn');if(p)p.disabled=!el.checked;}
  if(k==='birthConsent')S.birthConsent=el.checked;
  if(k==='by'||k==='bm'||k==='bd'){
    S.bd[{by:'y',bm:'m',bd:'d'}[k]]=el.value;
    if(k!=='bd'){const d=$('#bd');if(+S.bd.d>dim(+S.bd.y||2000,+S.bd.m||1))S.bd.d='';d.innerHTML=dayOpts();}
  }
});
document.addEventListener('keydown',e=>{
  if(S.screen!=='pw'||$('#modal').classList.contains('on'))return;
  if(/^[0-9]$/.test(e.key))pwPush(e.key);
  if(e.key==='Backspace'){S.pw=S.pw.slice(0,-1);updatePw();}
});

/* ---------- 启动 ---------- */
$('#brand').textContent=t('brand');
$('#aboutBtn').textContent=t('bar.about');
$('#aboutBtn').addEventListener('click',()=>openModal(aboutHtml()));
const sfxBtn=$('#sfxBtn');sfxBtn.textContent=t('sfx.off');
sfxBtn.addEventListener('click',()=>{S.sfx=!S.sfx;sfxBtn.textContent=t(S.sfx?'sfx.on':'sfx.off');sfxBtn.setAttribute('aria-pressed',S.sfx);sfx('gesture');});
render();
})();
</script>
